name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check server.mjs && node --check web/app.js && bash -n install.sh && bash -n uninstall.sh
      - run: npm run check:privacy
